cluster_name: lab-cluster
headnode_hostname: head01
lab_user: lab-hpc
lab_uid: 1000
lab_gid: 1000
nfs_subnet: 192.168.0.0/24
# package: usa o Slurm do Ubuntu; build: compila (PMIx + NVML)
slurm_install_method: package
# Compute capability mínima aceita pelo driver escolhido
nvidia_min_compute_cap: 6.0
nvidia_driver_version: "580"
cuda_version: "13-0"
# Versão usada quando slurm_install_method: build
slurm_build_version: "25.05.3"
