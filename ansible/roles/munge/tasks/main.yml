---
- name: Instalar munge
  ansible.builtin.apt:
    name: munge
    state: present

- name: Gerar chave munge no headnode (uma única vez)
  ansible.builtin.command: /usr/sbin/mungekey --create
  args:
    creates: /etc/munge/munge.key
  when: inventory_hostname in groups['headnode']
  notify: Reiniciar munge

- name: Trazer a chave do headnode para o controlador (binário, fora do git)
  ansible.builtin.fetch:
    src: /etc/munge/munge.key
    dest: "{{ playbook_dir }}/../../secrets/munge.key"
    flat: true
  delegate_to: "{{ groups['headnode'][0] }}"
  run_once: true
  become: true

- name: Instalar a mesma chave em todos os hosts
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../secrets/munge.key"
    dest: /etc/munge/munge.key
    owner: munge
    group: munge
    mode: "0400"
  notify: Reiniciar munge

- name: Garantir munge ativo
  ansible.builtin.service:
    name: munge
    state: started
    enabled: true
